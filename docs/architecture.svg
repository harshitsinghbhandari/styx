<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="'SF Mono', 'Menlo', 'Consolas', monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa4b2"/>
    </marker>
    <marker id="arrow-cockroach" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5fa8ff"/>
    </marker>
    <marker id="arrow-aws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffb454"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7684"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="1000" fill="#0b0f14"/>

  <!-- title -->
  <text x="40" y="46" fill="#e8ecf1" font-size="26" font-weight="bold">Styx: commitment kernel architecture</text>
  <text x="40" y="70" fill="#8b95a3" font-size="14">Agents act, the kernel commits, CockroachDB tells the future back to the agents</text>

  <!-- legend -->
  <g font-size="12" fill="#8b95a3">
    <rect x="1180" y="24" width="14" height="14" rx="3" fill="#123a63" stroke="#5fa8ff"/>
    <text x="1200" y="35">CockroachDB</text>
    <rect x="1180" y="46" width="14" height="14" rx="3" fill="#4a2f10" stroke="#ffb454"/>
    <text x="1200" y="57">AWS</text>
    <line x1="1310" y1="31" x2="1340" y2="31" stroke="#5fa8ff" stroke-width="2.5" marker-end="url(#arrow-cockroach)"/>
    <text x="1348" y="35">changefeed / data flow</text>
  </g>

  <!-- ================= AGENTS CLUSTER ================= -->
  <g>
    <rect x="60" y="100" width="1180" height="150" rx="14" fill="#11151c" stroke="#2a3340" stroke-width="1.5"/>
    <text x="82" y="126" fill="#c9d1e0" font-size="15" font-weight="bold">Agent fleet (Hermes design)</text>

    <!-- worker agent 1 -->
    <rect x="82" y="140" width="230" height="92" rx="10" fill="#171d27" stroke="#3a4556" stroke-width="1.5"/>
    <text x="197" y="168" fill="#e8ecf1" font-size="14" text-anchor="middle" font-weight="bold">worker agent</text>
    <text x="197" y="188" fill="#8b95a3" font-size="11.5" text-anchor="middle">private memory</text>
    <text x="197" y="204" fill="#8b95a3" font-size="11.5" text-anchor="middle">(SQLite + FTS)</text>
    <text x="197" y="221" fill="#5f6b7a" font-size="10.5" text-anchor="middle">agent/src/memory.ts, store.ts</text>

    <!-- worker agent 2 -->
    <rect x="332" y="140" width="230" height="92" rx="10" fill="#171d27" stroke="#3a4556" stroke-width="1.5"/>
    <text x="447" y="168" fill="#e8ecf1" font-size="14" text-anchor="middle" font-weight="bold">worker agent</text>
    <text x="447" y="188" fill="#8b95a3" font-size="11.5" text-anchor="middle">private memory</text>
    <text x="447" y="204" fill="#8b95a3" font-size="11.5" text-anchor="middle">(SQLite + FTS)</text>
    <text x="447" y="221" fill="#5f6b7a" font-size="10.5" text-anchor="middle">agent/src/memory.ts, store.ts</text>

    <!-- worker agent 3 -->
    <rect x="582" y="140" width="230" height="92" rx="10" fill="#171d27" stroke="#3a4556" stroke-width="1.5"/>
    <text x="697" y="168" fill="#e8ecf1" font-size="14" text-anchor="middle" font-weight="bold">worker agent</text>
    <text x="697" y="188" fill="#8b95a3" font-size="11.5" text-anchor="middle">private memory</text>
    <text x="697" y="204" fill="#8b95a3" font-size="11.5" text-anchor="middle">(SQLite + FTS)</text>
    <text x="697" y="221" fill="#5f6b7a" font-size="10.5" text-anchor="middle">agent/src/memory.ts, store.ts</text>

    <!-- repair agent -->
    <rect x="832" y="140" width="230" height="92" rx="10" fill="#1c1620" stroke="#4a3a56" stroke-width="1.5"/>
    <text x="947" y="168" fill="#e8ecf1" font-size="14" text-anchor="middle" font-weight="bold">repair agent</text>
    <text x="947" y="188" fill="#8b95a3" font-size="11.5" text-anchor="middle">private memory</text>
    <text x="947" y="204" fill="#8b95a3" font-size="11.5" text-anchor="middle">(SQLite + FTS)</text>
    <text x="947" y="221" fill="#5f6b7a" font-size="10.5" text-anchor="middle">agent/src/memory.ts, store.ts</text>
  </g>

  <!-- MCP dashed optional box, off to the side of the fleet -->
  <rect x="1112" y="140" width="128" height="92" rx="10" fill="#171d27" stroke="#4a5568" stroke-width="1.3" stroke-dasharray="5,4"/>
  <text x="1176" y="164" fill="#c9d1e0" font-size="10.5" text-anchor="middle" font-weight="bold">CockroachDB</text>
  <text x="1176" y="178" fill="#c9d1e0" font-size="10.5" text-anchor="middle" font-weight="bold">Managed MCP</text>
  <text x="1176" y="192" fill="#c9d1e0" font-size="10.5" text-anchor="middle" font-weight="bold">Server</text>
  <text x="1176" y="208" fill="#8b95a3" font-size="9.5" text-anchor="middle">read-only</text>
  <text x="1176" y="220" fill="#8b95a3" font-size="9.5" text-anchor="middle">introspection</text>
  <text x="1176" y="266" fill="#6b7684" font-size="10" text-anchor="middle" font-style="italic">optional / dev-workflow:</text>
  <text x="1176" y="279" fill="#6b7684" font-size="10" text-anchor="middle" font-style="italic">env-configured stub, not live</text>

  <!-- ================= STYX API ================= -->
  <rect x="470" y="320" width="400" height="80" rx="12" fill="#141a24" stroke="#3a4556" stroke-width="1.5"/>
  <text x="670" y="348" fill="#e8ecf1" font-size="15" text-anchor="middle" font-weight="bold">Styx API</text>
  <text x="670" y="366" fill="#8b95a3" font-size="11.5" text-anchor="middle">Fastify HTTP + SSE, kernel/src/api</text>
  <text x="670" y="382" fill="#5f6b7a" font-size="10" text-anchor="middle">POST /v1/reservations, POST /v1/commitments/:id/transitions, GET /v1/events</text>

  <!-- agents -> styx api -->
  <path d="M 670 250 L 670 320" fill="none" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="694" y="290" fill="#8b95a3" font-size="11">HTTP calls</text>

  <!-- MCP -> DB direct dashed (bypass kernel) -->
  <path d="M 1176 232 C 1176 400, 1320 420, 1320 480 L 1320 560 C 1320 600, 1000 605, 902 608" fill="none" stroke="#6b7684" stroke-width="1.6" stroke-dasharray="6,5" marker-end="url(#arrow-dashed)"/>
  <text x="1345" y="440" fill="#6b7684" font-size="10.5" text-anchor="middle">bypasses kernel</text>
  <text x="1345" y="454" fill="#6b7684" font-size="10.5" text-anchor="middle">API, read-only</text>

  <!-- ================= KERNEL ================= -->
  <rect x="470" y="440" width="400" height="90" rx="12" fill="#141a24" stroke="#3a4556" stroke-width="1.5"/>
  <text x="670" y="468" fill="#e8ecf1" font-size="15" text-anchor="middle" font-weight="bold">Commitment kernel</text>
  <text x="670" y="487" fill="#8b95a3" font-size="11.5" text-anchor="middle">transitionCommitment, cascade, kinds</text>
  <text x="670" y="504" fill="#5f6b7a" font-size="10" text-anchor="middle">kernel/src/kernel.ts, transition.ts, cascade.ts</text>

  <path d="M 670 400 L 670 440" fill="none" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= COCKROACHDB ================= -->
  <rect x="440" y="570" width="460" height="180" rx="14" fill="#0d2138" stroke="#5fa8ff" stroke-width="1.8"/>
  <text x="670" y="598" fill="#7fc0ff" font-size="16" text-anchor="middle" font-weight="bold">CockroachDB</text>
  <g font-size="12" fill="#c9d9ec" text-anchor="middle">
    <text x="670" y="622">commitments</text>
    <text x="670" y="642">commitment_events</text>
    <text x="670" y="662">commitment_dependencies</text>
    <text x="670" y="682">precedents (+ VECTOR index)</text>
    <text x="670" y="702">operation_results</text>
    <text x="670" y="722">agents, resources</text>
  </g>

  <path d="M 670 530 L 670 570" fill="none" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="694" y="553" fill="#8b95a3" font-size="11">reads / writes</text>

  <!-- ================= RUNNER (own box, engine-level) ================= -->
  <rect x="70" y="440" width="270" height="180" rx="12" fill="#141a24" stroke="#3a4556" stroke-width="1.5"/>
  <text x="205" y="468" fill="#e8ecf1" font-size="15" text-anchor="middle" font-weight="bold">Runner</text>
  <text x="205" y="486" fill="#8b95a3" font-size="10.5" text-anchor="middle">pipelines-model fleet runner</text>
  <text x="205" y="503" fill="#5f6b7a" font-size="10" text-anchor="middle">runner/src/engine.ts</text>
  <text x="205" y="524" fill="#8b95a3" font-size="10" text-anchor="middle">reserve on stage start,</text>
  <text x="205" y="539" fill="#8b95a3" font-size="10" text-anchor="middle">dependencies = pipeline edges,</text>
  <text x="205" y="554" fill="#8b95a3" font-size="10" text-anchor="middle">outcome = lifecycle transition</text>
  <line x1="92" y1="568" x2="318" y2="568" stroke="#2a3340" stroke-width="1"/>
  <text x="205" y="588" fill="#ff9d6c" font-size="11" text-anchor="middle" font-weight="bold">enforcement point:</text>
  <text x="205" y="604" fill="#ff9d6c" font-size="11" text-anchor="middle" font-weight="bold">agents cannot bypass it</text>

  <!-- runner -> styx api / kernel -->
  <path d="M 340 490 C 400 490, 420 460, 470 455" fill="none" stroke="#9aa4b2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= CONSOLE ================= -->
  <rect x="1230" y="320" width="270" height="110" rx="12" fill="#141a24" stroke="#3a4556" stroke-width="1.5"/>
  <text x="1365" y="350" fill="#e8ecf1" font-size="15" text-anchor="middle" font-weight="bold">Console</text>
  <text x="1365" y="369" fill="#8b95a3" font-size="11.5" text-anchor="middle">React + Vite, ui/</text>
  <text x="1365" y="398" fill="#8b95a3" font-size="10.5" text-anchor="middle">ticker / DAG / inspector</text>
  <text x="1365" y="414" fill="#5f6b7a" font-size="10" text-anchor="middle">read-only</text>

  <!-- console <-> styx api dashed sse -->
  <path d="M 1230 372 L 870 360" fill="none" stroke="#6b7684" stroke-width="1.8" stroke-dasharray="6,5" marker-end="url(#arrow-dashed)"/>
  <text x="1050" y="345" fill="#8b95a3" font-size="11" text-anchor="middle">SSE, read-only</text>
  <text x="1050" y="359" fill="#8b95a3" font-size="11" text-anchor="middle">ticker/DAG/inspector</text>

  <!-- ================= CHANGEFEED -> AWS PATH ================= -->
  <path d="M 900 660 L 1060 660" fill="none" stroke="#5fa8ff" stroke-width="2.2" marker-end="url(#arrow-cockroach)"/>
  <text x="980" y="633" fill="#7fc0ff" font-size="10.5" text-anchor="middle">CHANGEFEED</text>
  <text x="980" y="646" fill="#7fc0ff" font-size="10.5" text-anchor="middle">commitment_events</text>
  <text x="980" y="676" fill="#7fc0ff" font-size="10.5" text-anchor="middle">WITH updated, resolved</text>

  <!-- API Gateway -->
  <rect x="1060" y="620" width="180" height="80" rx="10" fill="#3a2510" stroke="#ffb454" stroke-width="1.8"/>
  <text x="1150" y="650" fill="#ffcf94" font-size="14" text-anchor="middle" font-weight="bold">API Gateway</text>
  <text x="1150" y="670" fill="#d9b98a" font-size="10.5" text-anchor="middle">AWS</text>
  <text x="1150" y="686" fill="#d9b98a" font-size="10" text-anchor="middle">webhook endpoint</text>

  <!-- Lambda styx-router -->
  <rect x="1290" y="620" width="230" height="90" rx="10" fill="#3a2510" stroke="#ffb454" stroke-width="1.8"/>
  <text x="1405" y="648" fill="#ffcf94" font-size="14" text-anchor="middle" font-weight="bold">Lambda: styx-router</text>
  <text x="1405" y="666" fill="#d9b98a" font-size="10" text-anchor="middle">router/src/lambda.ts</text>
  <text x="1405" y="683" fill="#d9b98a" font-size="9.5" text-anchor="middle">dedupe via processed_events</text>
  <text x="1405" y="697" fill="#d9b98a" font-size="9.5" text-anchor="middle">at-least-once to exactly-once wake</text>

  <path d="M 1240 660 L 1290 660" fill="none" stroke="#ffb454" stroke-width="2.2" marker-end="url(#arrow-aws)"/>

  <!-- Lambda -> wake relay -->
  <rect x="1290" y="760" width="230" height="80" rx="10" fill="#171d27" stroke="#3a4556" stroke-width="1.5"/>
  <text x="1405" y="790" fill="#e8ecf1" font-size="14" text-anchor="middle" font-weight="bold">Wake relay</text>
  <text x="1405" y="808" fill="#8b95a3" font-size="10.5" text-anchor="middle">agent/src/relay.ts</text>
  <text x="1405" y="824" fill="#5f6b7a" font-size="9.5" text-anchor="middle">subscribes to kernel SSE (local/dev)</text>

  <path d="M 1405 710 L 1405 760" fill="none" stroke="#ffb454" stroke-width="2.2" marker-end="url(#arrow-aws)"/>
  <text x="1440" y="732" fill="#8b95a3" font-size="9.5" text-anchor="start">cloud path: router posts</text>
  <text x="1440" y="745" fill="#8b95a3" font-size="9.5" text-anchor="start">wake-ups directly</text>

  <!-- wake relay loops back to agents cluster, routed down the left margin -->
  <path d="M 1290 795 L 60 795 C 30 795, 30 250, 60 200" fill="none" stroke="#5fa8ff" stroke-width="2.2" marker-end="url(#arrow-cockroach)"/>
  <text x="675" y="815" fill="#7fc0ff" font-size="12" text-anchor="middle" font-weight="bold">wake-up: closes the loop back to the fleet</text>
  <text x="675" y="831" fill="#6b7684" font-size="10.5" text-anchor="middle" font-style="italic">"memory of the future": agents act, kernel commits, the DB tells the future back to agents</text>

</svg>
